async function enter(){ME=null;const{data:{session}}=await SB.auth.getSession();if(!session)return;
const{data:p,error:pe}=await SB.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
if(!p){const m=pe?('خطأ: '+pe.message):('لا يوجد بروفايل للمعرّف '+session.user.id);await SB.auth.signOut();return toast(m)}

const L=(k,n)=>`<a href="#${k}" class="${h==k?'on':''}">${n}</a>`;
let n=!u?L('home','الرئيسية')+L('login','دخول')+L('register','تسجيل'):u.role=='admin'?L('admin/over','𓉴 اللوحة')+L('admin/students','الطلاب')+L('admin/att','𓂀 الحضور')+L('admin/content','الدروس')+L('admin/ann','إعلانات')+L('admin/profile','الملف')+L('admin/reports','تقارير'):L('app/dash','𓉴 الرئيسية')+L('app/lessons','𓉶 الدروس')+L('app/quiz','📜 الاختبارات')+L('app/games','𓃀 الألعاب')+L('app/live','𓈗 البث')+L('app/att','𓂀 حضوري');
E('#hd',`<div class="logo" onclick="location.hash='home'">${t.photo?`<img class="av" src="${t.photo}">`:'<span class="av">𓂀</span>'}<span class="disp">${t.name}</span></div><nav>${n}<a href="#" onclick="theme();return false">🌓</a>${u?'<a href="#" onclick="logout();return false">خروج</a>':''}</nav>`)}

head();const f=R[h]||R.home;E('#v',f());window.scrollTo(0,0);if(f.after)f.after()}
const pg=c=>`<main>${c}</main>`;
const R={
home(){const t=D.teacher;return `<div class="hero"><div class="pyr" style="inset-inline-start:8%"></div><div class="pyr" style="inset-inline-start:22%;transform:scale(.6)"></div><div class="pyr" style="inset-inline-end:8%;transform:scale(1.2)"></div><div class="sand">${'<i style="top:'+Math.random()*100+'%;right:'+Math.random()*100+'%"></i>'.repeat(0)}${Array.from({length:25},()=>`<i style="top:${Math.random()*100}%;right:${Math.random()*100}%;animation-delay:${Math.random()*7}s"></i>`).join('')}</div>
${t.photo?`<img class="frame" src="${t.photo}">`:'<div class="frame">𓂀</div>'}<div class="cart disp">${t.name}</div><h2>${t.title}</h2><p>🌴 رحلة ممتعة في تاريخ مصر وجغرافيا العالم 🌴</p><a class="btn" href="#register">انضم الآن 𓋹</a> <a class="btn st" href="#login">تسجيل الدخول</a></div>
${pg(`<div class="orn">𓆣 𓋹 𓂀 𓋹 𓆣</div><div class="card scroll"><h2>عن المدرس</h2><p>${t.bio}</p><p><span class="tag">${t.exp} سنة خبرة</span> <span class="tag">${t.grades}</span></p></div>
<h2>المميزات</h2><div class="grid">${[['𓉶','دروس فيديو منظمة'],['📜','اختبارات فورية'],['𓃀','ألعاب تعليمية'],['𓈗','حصص مباشرة'],['𓂀','متابعة الحضور'],['𓋹','نقاط ورتب فرعونية']].map(a=>`<div class="card stat"><b>${a[0]}</b>${a[1]}</div>`).join('')}</div>
<h2>الأسئلة الشائعة</h2><div class="card"><details><summary>كيف أسجل؟</summary>اضغط "انضم الآن" وأدخل بياناتك ورقم ولي الأمر.</details><details><summary>هل الدروس متاحة دائمًا؟</summary>نعم، في أي وقت من أي جهاز.</details></div>

'app/att'(){const u=sess(),e=Object.entries(D.att).filter(([d,m])=>m[u.id]).sort().reverse();const c={p:'حاضر ✅',a:'غائب ❌',l:'متأخر ⏰'};
return pg(`<h2>𓂀 حضوري</h2><div class="card">${e.map(([d,m])=>`<p>${d}: ${c[m[u.id]]}</p>`).join('')||'لا سجلات بعد'}</div>`)}});
function openL(id){const l=D.lessons.find(x=>x.id==id),u=sess();$('#lv').innerHTML=`<div class="card scroll"><h3>${l.title}</h3>${l.video?`<div class="vid"><iframe src="${l.video}" allowfullscreen></iframe><div class="wm">${u.name} – ${u.phone}</div></div>`:''}<p>${l.notes}</p><button class="btn sm st" onclick="dlSum('${id}')">⬇ تحميل الملخص</button></div>`;$('#lv').scrollIntoView()}
function dlSum(id){const l=D.lessons.find(x=>x.id==id),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([l.title+'\n\n'+l.notes]));a.download='ملخص.txt';a.click()}
function joinLive(id){const l=D.live.find(x=>x.id==id),u=sess();(D.att[today()]=D.att[today()]||{})[u.id]='p';SB.from('attendance').upsert({student_id:u.id,status:'present',live_id:id},{onConflict:'student_id,day',ignoreDuplicates:true}).then(r=>err(r.error));toast('تم تسجيل حضورك 𓂀');
$('#lr').innerHTML=`<div class="card"><iframe src="${l.url}" allow="camera;microphone" style="width:100%;height:60vh;border:0"></iframe><button class="btn sm" onclick="toast('✋ تم رفع يدك')">✋ ارفع يدك</button></div>`}
let QS;function startQ(id,fast){const q=D.quizzes.find(x=>x.id==id);QS={q,i:0,s:0,t:q.time,fast,m:[]};clearInterval(QS.iv);
QS.iv=setInterval(()=>{if(--QS.t<=0)endQ();else if($('#tm'))$('#tm').textContent=QS.t},1000);showQ()}
function showQ(){const{q,i}=QS,x=q.qs[i],h=`<div class="card scroll"><b>⏳ <span id="tm">${QS.t}</span>ث</b> — سؤال ${i+1}/${q.qs.length}<h3>${x.q}</h3>${x.o.map((o,k)=>`<button class="btn st opt" onclick="ans(${k},this)">${o}</button>`).join('')}</div>`;
($('#ga')&&QS.fast?$('#ga'):$('#qa')||$('#v')).innerHTML=h}
function ans(k,b){const x=QS.q.qs[QS.i];if(k==x.a)QS.s++;else QS.m.push(x);b.classList.add(k==x.a?'ok':'no');
document.querySelectorAll('.opt').forEach(e=>e.disabled=true);setTimeout(()=>{if(++QS.i>=QS.q.qs.length)endQ();else showQ()},700)}
function endQ(){clearInterval(QS.iv);const{q,s}=QS,u=sess();D.subs.push({uid:u.id,title:q.title,score:s,total:q.qs.length,d:today()});SB.from('submissions').insert({student_id:u.id,title:q.title,score:s,total:q.qs.length}).then(r=>err(r.error));addPts(s*10,s==q.qs.length?'عين حورس':null);
const h=`<div class="card"><h2>النتيجة: ${s}/${q.qs.length} 🎉</h2><p>+${s*10} نقطة</p><h3>مراجعة الأخطاء</h3>${QS.m.map(x=>`<p>❌ ${x.q} ← ${x.o[x.a]}</p>`).join('')||'لا أخطاء! ✨'}<a class="btn" href="#app/dash">الرئيسية</a></div>`;
($('#ga')&&QS.fast?$('#ga'):$('#qa')||$('#v')).innerHTML=h}
function memory(){const P=['🔺 الهرم|الجيزة','🏛 الكرنك|الأقصر','🗿 أبو الهول|الجيزة','🌊 النيل|أسوان'];let cs=[];['الأهرامات','معبد الكرنك','أبو الهول','السد العالي'].forEach((n,i)=>{cs.push({k:i,t:n},{k:i,t:['الجيزة','الأقصر','الجيزة هضبة','أسوان'][i]})});cs.sort(()=>Math.random()-.5);let op=[],done=0;
$('#ga').innerHTML=`<div class="card"><h3>معبد الذاكرة</h3><div class="mem">${cs.map((c,i)=>`<div class="mc" id="c${i}">𓂀</div>`).join('')}</div></div>`;
cs.forEach((c,i)=>{$('#c'+i).onclick=()=>{const e=$('#c'+i);if(op.length>1||e.classList.contains('o')||e.classList.contains('d'))return;e.textContent=c.t;e.classList.add('o');op.push([i,c]);
if(op.length==2){const[a,b]=op;if(a[1].k==b[1].k){setTimeout(()=>{[a,b].forEach(z=>$('#c'+z[0]).className='mc d');op=[];if(++done==4){addPts(40,'حارس النيل');toast('+40 نقطة وسام حارس النيل 🪲')}},400)}else setTimeout(()=>{[a,b].forEach(z=>{$('#c'+z[0]).className='mc';$('#c'+z[0]).textContent='𓂀'});op=[]},800)}}})}
function tline(){const S=[['توحيد القطرين على يد مينا','بناء الهرم الأكبر','طرد الهكسوس على يد أحمس','حكم الملكة حتشبسوت','حكم رمسيس الثاني'],['البعثة النبوية','الهجرة إلى المدينة','فتح مكة','فتح مصر على يد عمرو بن العاص','تأسيس مدينة القاهرة']];const s=S[Math.random()*2|0],sh=[...s].sort(()=>Math.random()-.5);let n=0;
$('#ga').innerHTML=`<div class="card"><h3>𓉐 جدار الزمن</h3><p>اضغط الأحداث بالترتيب من الأقدم إلى الأحدث</p>${sh.map(x=>`<button class="btn st opt">${x}</button>`).join('')}</div>`;
document.querySelectorAll('#ga .opt').forEach(b=>b.onclick=()=>{if(b.textContent==s[n]){b.classList.add('ok');b.disabled=true;if(++n==s.length){addPts(30,'حارس الزمن');toast('أحسنت! +30 نقطة 𓂀')}}else toast('❌ ليس هذا هو الحدث التالي')})}
let M;function mapq(){M={C:[['القاهرة',110,62],['الإسكندرية',72,20],['أسوان',122,205],['الأقصر',118,160],['بورسعيد',138,22],['السويس',146,70]],r:0,s:0};mnext()}
function mnext(){if(M.r==5){addPts(M.s*8,M.s==5?'حارس النيل':null);$('#ga').innerHTML=`<div class="card"><h3>النتيجة ${M.s}/5 🎉</h3><p>+${M.s*8} نقطة</p></div>`;return}M.t=Math.random()*6|0;M.r++;
$('#ga').innerHTML=`<div class="card"><h3>🗺 خريطة مصر (تقريبية)</h3><p>سؤال ${M.r}/5: أين تقع <b>${M.C[M.t][0]}</b>؟</p><svg viewBox="0 0 200 240" style="max-width:340px;width:100%;display:block;margin:auto"><polygon points="30,15 160,15 150,60 190,120 160,230 30,230" fill="#e9cf94" stroke="#D4A24C" stroke-width="2"/><path d="M122 230 L118 160 L110 62 L110 22" stroke="#2A9D8F" stroke-width="4" fill="none"/>${M.C.map((c,i)=>`<circle cx="${c[1]}" cy="${c[2]}" r="9" fill="#B5543A" stroke="#fff" stroke-width="2" style="cursor:pointer" onclick="mpick(${i})"/>`).join('')}</svg></div>`}
function mpick(i){if(i==M.t){M.s++;toast('✅ صح')}else toast('❌ هذه '+M.C[i][0]);mnext()}
const WF=[['أحمس',['طردت الهكسوس من مصر','أسست الأسرة الثامنة عشرة','بدأ في عهدي عصر الدولة الحديثة']],['حتشبسوت',['ملكة حكمت مصر','أرسلت بعثة تجارية إلى بلاد بونت','معبدي في الدير البحري']],['رمسيس الثاني',['من أشهر ملوك مصر','حاربت الحيثيين في قادش','بنيت معبد أبو سمبل']],['توت عنخ آمون',['ملك صغير السن','اكتُشفت مقبرتي سنة 1922','قناعي الذهبي مشهور']],['صلاح الدين الأيوبي',['قائد مسلم من الأيوبيين','انتصرت في معركة حطين','حررت بيت المقدس']],['محمد علي',['حكمت مصر في القرن 19','أسست مصر الحديثة','أنشأت جيشًا قويًا ومدارس']]];
let W;function who(){const f=WF[Math.random()*6|0];W={f,c:1,o:WF.map(x=>x[0]).filter(x=>x!=f[0]).sort(()=>Math.random()-.5).slice(0,3).concat(f[0]).sort(()=>Math.random()-.5)};wr()}
function wr(){$('#ga').innerHTML=`<div class="card scroll"><h3>𓁹 مَن أنا؟</h3>${W.f[1].slice(0,W.c).map(x=>`<p>𓏞 ${x}</p>`).join('')}${W.o.map((o,i)=>`<button class="btn st opt" onclick="wp('${o}')">${o}</button>`).join('')}${W.c<3?'<button class="btn sm" onclick="W.c++;wr()">تلميح إضافي</button>':''}</div>`}
function wp(o){if(o==W.f[0]){const p=20-5*(W.c-1);addPts(p,'عين حورس');toast('✅ صح! +'+p+' نقطة');who()}else toast('❌ حاول مرة أخرى')}
/* ADMIN */
const stu=()=>D.users.filter(u=>u.role=='student');
Object.assign(R,{
'admin/over'(){const s=stu(),a=D.att[today()]||{},pr=Object.values(a).filter(x=>x=='p').length,avg=D.subs.length?Math.round(D.subs.reduce((t,x)=>t+x.score/x.total,0)/D.subs.length*100):0;
return pg(`<h2>𓉴 لوحة التحكم</h2><div class="grid"><div class="card stat"><b>${s.length}</b>طالب</div><div class="card stat"><b>${s.length?Math.round(pr/s.length*100):0}%</b>حضور اليوم</div><div class="card stat"><b>${avg}%</b>متوسط الاختبارات</div><div class="card stat"><b>${D.lessons.length}</b>درس</div></div>
<div class="card"><h3>الطلاب لكل صف</h3>${GR.map(g=>{const n=s.filter(x=>x.grade==g).length;return `<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><span style="width:140px;font-size:.8rem">${g}</span><div style="background:var(--tq);height:14px;border-radius:8px;width:${n*30+4}px"></div>${n}</div>`}).join('')}</div>`)},
'admin/students'(){return pg(`<h2>الطلاب</h2><div class="card"><input id="sq" placeholder="بحث بالاسم أو الهاتف" oninput="stList()"><select id="sg" onchange="stList()"><option value="">كل الصفوف</option>${GR.map(g=>`<option>${g}</option>`).join('')}</select><button class="btn sm" onclick="exportX()">⬇ تصدير Excel</button><div class="tw" id="st"></div></div>`)},
'admin/att'(){return pg(`<h2>𓂀 الحضور</h2><div class="card"><input type="date" id="ad" value="${today()}" onchange="attList()"><div class="tw" id="al"></div></div>`)},
'admin/content'(){return pg(`<h2>إدارة الدروس</h2><div class="card"><select id="lg">${GR.map(g=>`<option>${g}</option>`).join('')}</select><input id="lu" placeholder="الوحدة"><input id="lt" placeholder="عنوان الدرس"><input id="lv2" placeholder="رابط فيديو (embed)"><textarea id="ln" placeholder="ملخص"></textarea><button class="btn" onclick="addL()">إضافة درس</button></div>${D.lessons.map(l=>`<div class="card">${l.grade} — ${l.title} <button class="btn sm st" onclick="tgL('${l.id}')">${l.pub?'إخفاء':'نشر'}</button> <button class="btn sm red" onclick="delL('${l.id}')">حذف</button></div>`).join('')}`)},
'admin/ann'(){return pg(`<h2>الإعلانات</h2><div class="card"><select id="ag"><option value="all">كل الطلاب</option>${GR.map(g=>`<option>${g}</option>`).join('')}</select><textarea id="at"></textarea><button class="btn" onclick="addA()">نشر</button></div>${D.ann.map(a=>`<div class="card">${a.text} <small>(${a.grade=='all'?'الكل':a.grade})</small> <button class="btn sm red" onclick="delA('${a.id}')">حذف</button></div>`).join('')}`)},
'admin/profile'(){const t=D.teacher;return pg(`<h2>الملف الشخصي للمدرس</h2><div class="card"><div class="frame" style="width:120px;height:120px">${t.photo?`<img src="${t.photo}" style="width:100%;height:100%;border-radius:inherit;object-fit:cover">`:'𓂀'}</div><input type="file" accept="image/*" onchange="photoUp(this)">
<label>الاسم</label><input id="tn" value="${t.name}"><label>المسمى</label><input id="tt" value="${t.title}"><label>نبذة</label><textarea id="tb">${t.bio}</textarea><label>واتساب</label><input id="tw" value="${t.whatsapp}"><label>سنوات الخبرة</label><input id="te" type="number" value="${t.exp}"><label>الصفوف</label><input id="tg" value="${t.grades}"><button class="btn" onclick="saveT()">حفظ</button></div>
<div class="card"><h3>تغيير كلمة المرور</h3><input id="np" type="password" placeholder="كلمة مرور جديدة"><button class="btn st" onclick="chPw()">تغيير</button></div>`)},
'admin/reports'(){return pg(`<h2>التقارير</h2><div class="card"><button class="btn sm" onclick="print()">🖨 طباعة</button><h3>أوائل الطلاب</h3>${stu().sort((a,b)=>b.points-a.points).slice(0,10).map((s,i)=>`<p>${i+1}. ${s.name} — ${s.points}</p>`).join('')||'-'}<h3>الغياب</h3>${stu().map(s=>`<p>${s.name}: ${Object.values(D.att).filter(m=>m[s.id]=='a').length} غياب</p>`).join('')}</div>`)}});
R['admin/students'].after=()=>stList();R['admin/att'].after=()=>attList();
function stList(){const q=$('#sq').value,g=$('#sg').value;const l=stu().filter(s=>(!g||s.grade==g)&&(s.name+s.phone).includes(q));
$('#st').innerHTML=`<table><tr><th>الاسم</th><th>الهاتف</th><th>الصف</th><th>نقاط</th><th></th></tr>${l.map(s=>`<tr><td>${s.name}</td><td>${s.phone}</td><td>${s.grade}</td><td>${s.points}</td><td><button class="btn sm st" onclick="blk('${s.id}')">${s.blocked?'فك الحظر':'حظر'}</button></td></tr>`).join('')||'<tr><td colspan=5>لا يوجد طلاب</td></tr>'}</table>`}
async function blk(id){const u=D.users.find(x=>x.id==id),v=!u.blocked;const{error}=await SB.from('profiles').update({blocked:v}).eq('id',id);if(err(error))return;u.blocked=v;stList()}
async function rp(id){const p=prompt('كلمة المرور الجديدة');if(p&&p.length>=6){D.users.find(x=>x.id==id).pw=await sha(p);save();toast('تم')}}
function exportX(){const r=['الاسم,الهاتف,هاتف ولي الأمر,الصف,النقاط',...stu().map(s=>[s.name,s.phone,s.pphone,s.grade,s.points].join(','))];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.join('\n')],{type:'text/csv'}));a.download='students.csv';a.click()}
function attList(){const d=$('#ad').value,m=D.att[d]||{};$('#al').innerHTML=`<table>${stu().map(s=>`<tr><td>${s.name}</td><td>${[['p','حاضر'],['a','غائب'],['l','متأخر']].map(([k,n])=>`<button class="btn sm ${m[s.id]==k?'':'st'}" onclick="mark('${d}','${s.id}','${k}')">${n}</button>`).join(' ')}${m[s.id]=='a'?` <a class="btn sm red" target="_blank" href="https://wa.me/2${(s.pphone||'').replace(/^0/,'')}?text=${encodeURIComponent('نبلغكم بغياب '+s.name+' اليوم '+d)}">واتساب</a>`:''}</td></tr>`).join('')||'<tr><td>لا طلاب</td></tr>'}</table>`}
async function mark(d,id,k){const{error}=await SB.from('attendance').upsert({student_id:id,day:d,status:ST[k]},{onConflict:'student_id,day'});if(err(error))return;(D.att[d]=D.att[d]||{})[id]=k;attList()}
async function addL(){const t=$('#lt').value.trim();if(!t)return toast('اكتب العنوان');const{data,error}=await SB.from('lessons').insert({grade:$('#lg').value,unit_title:$('#lu').value,title:t,video_url:$('#lv2').value,notes:$('#ln').value,published:true}).select().single();if(err(error))return;D.lessons.push({id:data.id,grade:data.grade,unit:data.unit_title||'',title:data.title,video:data.video_url||'',notes:data.notes||'',pub:true});toast('تمت الإضافة');route()}
async function delL(id){if(!confirm('حذف الدرس؟'))return;const{error}=await SB.from('lessons').delete().eq('id',id);if(err(error))return;D.lessons=D.lessons.filter(x=>x.id!=id);route()}
async function tgL(id){const l=D.lessons.find(x=>x.id==id);const{error}=await SB.from('lessons').update({published:!l.pub}).eq('id',id);if(err(error))return;l.pub=!l.pub;route()}
async function addA(){const t=$('#at').value.trim();if(!t)return;const g=$('#ag').value;const{data,error}=await SB.from('announcements').insert({body:t,grade:g}).select().single();if(err(error))return;D.ann.unshift({id:data.id,grade:g,text:t,d:today()});route()}
async function delA(id){const{error}=await SB.from('announcements').delete().eq('id',id);if(err(error))return;D.ann=D.ann.filter(x=>x.id!=id);route()}
function photoUp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(im.width,im.height);c.width=c.height=400;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,400,400);c.toBlob(async b=>{const up=await SB.storage.from('teacher').upload('photo.jpg',b,{upsert:true,contentType:'image/jpeg'});if(err(up.error))return;const url=SB.storage.from('teacher').getPublicUrl('photo.jpg').data.publicUrl+'?v='+Date.now();const{error}=await SB.from('teacher_settings').update({photo_url:url}).eq('id',1);if(err(error))return;D.teacher.photo=url;toast('تم رفع الصورة');route()},'image/jpeg',.85)};im.src=r.result};r.readAsDataURL(f)}
async function saveT(){const v={name:$('#tn').value,title:$('#tt').value,bio:$('#tb').value,whatsapp:$('#tw').value,exp:+$('#te').value||0,grades:$('#tg').value};const{error}=await SB.from('teacher_settings').update(v).eq('id',1);if(err(error))return;Object.assign(D.teacher,v);toast('تم الحفظ ✅');head()}
async function chPw(){const p=$('#np').value;if(p.length<6)return toast('6 أحرف على الأقل');const{error}=await SB.auth.updateUser({password:p});if(err(error))return;toast('تم تغيير كلمة المرور')}
addEventListener('hashchange',route);E('#v','<main><div class="card">جارٍ التحميل 𓂀</div></main>');init().then(route);
</script></body></html>
